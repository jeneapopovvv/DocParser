    You MUST classify the document into one of the following categories. Do NOT invent new types.

    | Type | Description |
    |------|-------------|
    {{listPlaceholder}}
    | unknown | Use ONLY when the document does not fit any category above |

    ## CLASSIFICATION RULES
    1. Analyze the document's structure, language, keywords, headers, and intent.
